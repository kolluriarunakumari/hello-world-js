apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Run App.js Workflow

on:
  push:
    branches:
      - '**'

jobs:
  run-app:
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1

      - name: Install dependencies
        uses: docker://node:18-alpine
        shell: sh
        run: |
          echo "Installing dependencies..."
          npm install

      - name: Run app.js
        uses: docker://node:18-alpine
        shell: sh
        env:
          NODE_ENV: production
        run: |
          echo "Running app.js..."
          node app.js