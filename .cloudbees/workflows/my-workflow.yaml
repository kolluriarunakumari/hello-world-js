apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Run App.js Workflow

on:
  push:
    branches:
      - main
      - feature/**

jobs:
  run-app:
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1

      - name: Install dependencies and verify
        uses: docker://node:18-alpine
        shell: sh
        run: |
          set -e
          echo "Installing dependencies..."
          npm install
          echo "✅ Dependencies installed successfully."
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"

      - name: Run app.js with graceful shutdown
        uses: docker://node:18-alpine
        shell: sh
        env:
          NODE_ENV: production
          PORT: 3000
        run: |
          set -e
          echo "========================================="
          echo " CI Pipeline Starting..."
          echo "========================================="

          # ── Step 1: Install dependencies ───────────
          echo ""
          echo "📦 Installing dependencies..."
          npm install
          echo "✅ Dependencies ready."

          # ── Step 2: Start server in background ─────
          echo ""
          echo "🚀 Starting app.js..."
          node app.js &
          APP_PID=$!
          echo "Server PID: $APP_PID"

          # ── Step 3: Wait for server to be ready ────
          echo ""
          echo "⏳ Waiting for server to start..."
          MAX_WAIT=30
          ELAPSED=0
          SERVER_READY=false

          # Install curl if not available
          apk add --no-cache curl 2>/dev/null || true

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              SERVER_READY=true
              break
            fi

            echo "  Waiting... ($ELAPSED s elapsed)"
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done

          if [ "$SERVER_READY" = "false" ]; then
            echo "❌ Server did not start within ${MAX_WAIT} seconds!"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi

          echo "✅ Server is running on http://localhost:3000"

          # ── Step 4: Validate main route response ───
          echo ""
          echo "🔍 Testing server response..."
          RESPONSE=$(curl -s http://localhost:3000/)
          echo "Server response: $RESPONSE"

          if echo "$RESPONSE" | grep -q "Hello World"; then
            echo "✅ Server response validation passed!"
          else
            echo "❌ Server response validation failed!"
            echo "   Expected: Hello World"
            echo "   Got: $RESPONSE"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi

          # ── Step 5: Health check ────────────────────
          echo ""
          echo "💓 Running health check..."
          HEALTH=$(curl -s http://localhost:3000/health)
          echo "Health response: $HEALTH"

          if echo "$HEALTH" | grep -q "ok"; then
            echo "✅ Health check passed!"
          else
            echo "❌ Health check failed!"
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi

          # ── Step 6: Graceful shutdown ───────────────
          echo ""
          echo "🛑 Shutting down server gracefully..."
          kill -SIGTERM $APP_PID 2>/dev/null || true
          sleep 2

          # Force kill if still running
          kill -9 $APP_PID 2>/dev/null || true
          echo "✅ Server shut down cleanly."

          echo ""
          echo "========================================="
          echo " ✅ CI Pipeline Passed Successfully!"
          echo "========================================="